<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FusionToDescription</title>
<style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #ffffff;
}

body {
  position: relative;
}

/*
 * Use an explicit, fixed-size image instead of percentage sizing or CSS
 * transforms. Fusion's palette webview can render percentage/transform
 * combinations inconsistently, which caused the previous cropped logo.
 */
.logo {
  position: absolute;
  width: 220px;
  height: 150px;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  object-fit: contain;
  object-position: center;
  display: block;
}
</style>
</head>
<body>
<img class="logo" src="icons/Fusion2Description_Logo.png" alt="FusionToDescription">
</body>
</html>
